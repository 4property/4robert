[pytest]
addopts = -p no:cacheprovider -m "not visual_iter"
cache_dir = .tmp_test/.pytest_cache
markers =
    visual_iter: opt-in marker for visual iteration tests that render PNGs to progress/ (feature 42 galaxy template). Excluded from init.sh by default; run with -m visual_iter to invoke explicitly.
norecursedirs =
    .git
    .runtime_locks
    .venv
    .tmp_test
    .tmp_test_cases
    .tmp_test_manual
    __pycache__
    generated_media
    generated_reels
    pytest-cache-files-*
    property_media
    property_media_raw
